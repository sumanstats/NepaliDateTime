name: Perl CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        perl-version:
          - "5.12"
          - "5.30"
          - "5.42"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Install cpanminus
        run: cpan App::cpanminus

      - name: Install dependencies
        run: |
          cpanm --installdeps . --notest

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: make

      - name: Test
        run: make test